name: Daily Marketing Research Digest

on:
  schedule:
    # 10:07 UTC = 5:07am CDT / 4:07am CST. GitHub cron is UTC-only, so the local
    # hour shifts an hour at each DST change; move it to 11:07 for the winter if
    # 5am sharp matters. The odd minute is deliberate: GitHub queues scheduled
    # runs and the queue is worst on a round hour. Expect it to start late
    # anyway -- 2.5 to 4.5 hours is typical across her repos, 11.5 the worst seen.
    - cron: "7 10 * * *"

  workflow_dispatch:
    inputs:
      focus:
        description: >
          Topic override (blank = today's rotation). Use a name from
          config/digest_config.json, e.g. "branding" or "pricing & promotions";
          anything else is searched as a plain phrase.
        required: false
        default: ""

# Two runs writing outputs/ at once would each push a commit the other has not
# seen; queue them instead.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Generate marketing research digest
    runs-on: ubuntu-latest
    # Calls go through the Batch API (scripts/llm.py), which usually answers in
    # minutes but can take longer. Each call waits up to 45 min before falling
    # back to a live call, and a run makes about three of those in a row, so the
    # cap leaves room for that instead of failing a slow but healthy run.
    timeout-minutes: 240

    permissions:
      contents: write   # commit the run back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node (the dashboard render test executes the page script)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Free, no API calls. The dashboard is plain JS reading JSON Python
      # writes; the suite is the only thing that connects the two.
      - name: Run tests
        run: python -m pytest tests/ -q

      # PYTHONUNBUFFERED so a hang's log names the stage it died in rather
      # than dying in the buffer (senior-research-digest, 2026-09-06).
      - name: Run digest pipeline
        timeout-minutes: 225
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          DIGEST_FOCUS: ${{ github.event.inputs.focus }}
        working-directory: scripts
        run: python main.py

      # The push is the deploy: Vercel's Git integration builds every commit
      # on main (vercel.json serves docs/). No token lives in this repo.
      - name: Commit the run
        run: |
          # The email must resolve to Meggers1982. Vercel's Hobby plan blocks
          # a private repo's deploy unless the commit author is on the team;
          # bot@users.noreply.github.com is a stranger's account called "bot",
          # so the first run's deploy came back BLOCKED (2026-09-14).
          git config user.name  "marketing-digest-bot"
          git config user.email "18274731+Meggers1982@users.noreply.github.com"
          # `if`, not `[ -d ] &&`: under bash -e a short-circuited && on the
          # last iteration fails the step (senior-research-digest, 2026-09-06).
          for dir in outputs topic_memory docs state; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          git diff --cached --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push
